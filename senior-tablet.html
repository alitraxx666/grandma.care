<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FFF4C7">
  <link rel="icon" href="favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Senior Tablet | Grandma.care</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root,
    body.theme-summer {
      --bg:#FFF4C7;
      --card:#FFFFFF;
      --text:#123A5A;
      --muted:#287489;
      --accent:#008CA8;
      --accent-deep:#006B83;
      --danger:#FF6B5E;
      --success:#29B86F;
      --border:#FFD88A;
      --shadow:0 12px 30px rgba(0,108,131,0.18);
      --yellow:#FFE37A;
      --done:#D9F8DF;
      --body-bg:
        radial-gradient(circle at top right, #B9F3FF 0%, transparent 30%),
        linear-gradient(135deg, #FFF4C7 0%, #FFE7A8 45%, #CFF7EF 100%);
      --photo-bg:#9FE7F5;
      --photo-label:linear-gradient(135deg,#00A7BE,#23C6B8);
      --reminder-bg:linear-gradient(135deg,#FFE981 0%,#FFD36A 100%);
      --done-bg:linear-gradient(135deg,#D9F8DF 0%,#B8F0CE 100%);
      --yes-bg:linear-gradient(135deg,#35D47A,#18A957);
      --help-bg:linear-gradient(135deg,#FF7B6D,#FF4F76);
      --family-bg:linear-gradient(135deg,#D7F7F2,#FFF7D6);
    }

    body.theme-spring {
      --bg:#F7FFE8;
      --card:#FFFFFF;
      --text:#24443A;
      --muted:#5B8C74;
      --accent:#79B88A;
      --accent-deep:#3F7F5F;
      --danger:#F47A8D;
      --success:#66B85F;
      --border:#D9EDB8;
      --shadow:0 12px 30px rgba(86,139,96,0.18);
      --yellow:#FFF2A8;
      --done:#E4F8DA;
      --body-bg:
        radial-gradient(circle at top right, #FFD6E6 0%, transparent 32%),
        linear-gradient(135deg, #F7FFE8 0%, #E7F8D8 42%, #D9F7EE 100%);
      --photo-bg:#D6F5DF;
      --photo-label:linear-gradient(135deg,#77C98B,#F4A8C4);
      --reminder-bg:linear-gradient(135deg,#FFF2A8 0%,#FFE0B5 100%);
      --done-bg:linear-gradient(135deg,#E4F8DA 0%,#C9F0BE 100%);
      --yes-bg:linear-gradient(135deg,#81D77B,#4FB968);
      --help-bg:linear-gradient(135deg,#F48BA0,#E85C79);
      --family-bg:linear-gradient(135deg,#E9FAD8,#FFF1F6);
    }

    body.theme-fall {
      --bg:#FFF0D8;
      --card:#FFFFFF;
      --text:#4A2B17;
      --muted:#8B5A32;
      --accent:#C66A2D;
      --accent-deep:#8F431F;
      --danger:#B8462E;
      --success:#6F8E3E;
      --border:#E7B071;
      --shadow:0 12px 30px rgba(120,72,32,0.20);
      --yellow:#FFD78A;
      --done:#E8F1D0;
      --body-bg:
        radial-gradient(circle at top right, #D66737 0%, transparent 30%),
        linear-gradient(135deg, #FFF0D8 0%, #FFD9A0 45%, #C8894E 100%);
      --photo-bg:#D99A5A;
      --photo-label:linear-gradient(135deg,#B85C2B,#E69B3A);
      --reminder-bg:linear-gradient(135deg,#FFD78A 0%,#F2A65A 100%);
      --done-bg:linear-gradient(135deg,#E8F1D0 0%,#C8D889 100%);
      --yes-bg:linear-gradient(135deg,#8FAF4D,#5F8F3A);
      --help-bg:linear-gradient(135deg,#D46A3C,#A83B2E);
      --family-bg:linear-gradient(135deg,#FFE0B5,#F6C48B);
    }

    body.theme-winter {
      --bg:#EAF7FF;
      --card:#FFFFFF;
      --text:#102C4A;
      --muted:#4E7895;
      --accent:#2A80B9;
      --accent-deep:#0E5B8A;
      --danger:#C92E3F;
      --success:#1F9D75;
      --border:#BFE3F7;
      --shadow:0 12px 30px rgba(20,80,120,0.18);
      --yellow:#FFF7C2;
      --done:#DDF6EF;
      --body-bg:
        radial-gradient(circle at top left, #FFFFFF 0%, transparent 26%),
        radial-gradient(circle at top right, #D72638 0%, transparent 18%),
        linear-gradient(135deg, #EAF7FF 0%, #D9F0FF 45%, #F7FBFF 100%);
      --photo-bg:#D9F0FF;
      --photo-label:linear-gradient(135deg,#0E5B8A,#D72638);
      --reminder-bg:linear-gradient(135deg,#FFFFFF 0%,#D9F0FF 100%);
      --done-bg:linear-gradient(135deg,#DDF6EF 0%,#B7ECDC 100%);
      --yes-bg:linear-gradient(135deg,#28B98B,#087F5B);
      --help-bg:linear-gradient(135deg,#E03A4E,#B91C2B);
      --family-bg:linear-gradient(135deg,#FFFFFF,#E6F6FF);
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:var(--body-bg);
      color:var(--text);
      min-height:100vh;
      overflow:hidden;
    }

    .sync-status {
      position:fixed;
      top:8px;
      right:10px;
      z-index:9999;
      background:rgba(255,255,255,.9);
      border:1px solid var(--border);
      color:var(--accent-deep);
      border-radius:999px;
      padding:6px 10px;
      font-size:.72rem;
      font-weight:900;
    }

    .tablet {
      height:100vh;
      display:grid;
      grid-template-columns:38% 62%;
    }

    .photo-side {
      position:relative;
      height:100vh;
      overflow:hidden;
      background:var(--photo-bg);
      border-right:6px solid rgba(255,255,255,.45);
    }

    .photo-side img {
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .photo-label {
      position:absolute;
      left:14px;
      bottom:14px;
      background:var(--photo-label);
      color:white;
      padding:9px 16px;
      border-radius:999px;
      font-size:.95rem;
      font-weight:900;
      box-shadow:var(--shadow);
    }

    .app-side {
      height:100vh;
      padding:12px 16px;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      align-items:center;
      text-align:center;
      overflow:hidden;
    }

    .clock {
      font-size:1.28rem;
      font-weight:900;
      color:var(--accent-deep);
      margin-bottom:4px;
      line-height:1.15;
    }

    .hello {
      font-size:1.85rem;
      font-weight:900;
      margin-bottom:8px;
      line-height:1;
      color:var(--text);
    }

    .card {
      width:min(700px,100%);
      background:white;
      border-radius:24px;
      padding:14px 16px;
      box-shadow:var(--shadow);
      border:1px solid rgba(255,255,255,.85);
    }

    .active-reminder {
      background:var(--reminder-bg);
      border:3px solid var(--accent);
    }

    .done-reminder {
      background:var(--done-bg);
      border:3px solid var(--success);
    }

    .time {
      font-size:1.25rem;
      font-weight:900;
      color:var(--accent-deep);
      margin-bottom:4px;
    }

    .task {
      font-size:1.75rem;
      line-height:1.05;
      font-weight:900;
      margin-bottom:6px;
      color:var(--text);
    }

    .instruction {
      font-size:.95rem;
      color:var(--muted);
      margin-bottom:10px;
      font-weight:800;
    }

    .buttons {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    button {
      border:none;
      border-radius:20px;
      padding:13px 10px;
      font-size:1.05rem;
      font-weight:900;
      cursor:pointer;
      color:white;
      box-shadow:0 8px 18px rgba(0,0,0,.12);
    }

    .yes { background:var(--yes-bg); }
    .help { background:var(--help-bg); }

    .status {
      margin-top:8px;
      font-size:.95rem;
      font-weight:900;
      color:var(--accent-deep);
    }

    .upcoming,
    .pillbox,
    .family-note {
      width:min(700px,100%);
      margin-top:8px;
      background:rgba(255,255,255,0.82);
      border:1px solid var(--border);
      border-radius:20px;
      padding:9px 12px;
      text-align:left;
      box-shadow:0 8px 20px rgba(0,0,0,0.08);
    }

    .family-note { background:var(--family-bg); }

    .section-title {
      font-size:.72rem;
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:900;
      color:var(--accent-deep);
      margin-bottom:4px;
    }

    .upcoming-text,
    .family-text {
      font-size:.95rem;
      font-weight:800;
      line-height:1.25;
      color:var(--text);
    }

    .pill-list {
      display:grid;
      gap:6px;
      max-height:155px;
      overflow:auto;
      padding-right:3px;
    }

    .pill-row {
      background:white;
      border:1px solid var(--border);
      border-radius:14px;
      padding:8px 10px;
      font-weight:800;
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      font-size:.95rem;
      color:var(--text);
    }

    .pill-row.active {
      background:var(--yellow);
      border:2px solid var(--accent);
    }

    .pill-row.done {
      background:var(--done);
      color:var(--success);
      border:2px solid var(--success);
    }

    .pill-time {
      color:var(--accent-deep);
      font-weight:900;
      white-space:nowrap;
    }

    .type-label {
      font-size:.75rem;
      color:var(--muted);
      font-weight:900;
      text-transform:uppercase;
      margin-right:5px;
    }

    .setup-message {
      padding:24px;
      font-size:1.2rem;
      font-weight:900;
      color:var(--accent-deep);
      background:white;
      border-radius:20px;
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      max-width:640px;
    }

    @media(max-width:850px) {
      body { overflow:auto; }

      .tablet {
        height:auto;
        min-height:100vh;
        grid-template-columns:1fr;
      }

      .photo-side { height:26vh; }

      .app-side {
        height:auto;
        min-height:74vh;
        padding:12px;
      }

      .task { font-size:1.55rem; }
      .buttons { grid-template-columns:1fr; }
      .pill-list { max-height:none; }
    }
  </style>
</head>

<body class="theme-summer">

<div class="sync-status" id="syncStatus">Connecting...</div>

<div class="tablet">
  <div class="photo-side">
    <img id="familyPhoto" src="family-photo-1.jpg" alt="Family photo slideshow">
    <div class="photo-label">Family Photos ❤️</div>
  </div>

  <div class="app-side">
    <div class="clock" id="clockDisplay">Loading time...</div>
    <div class="hello" id="helloText">Hi ❤️</div>

    <div class="card active-reminder" id="reminderCard">
      <div class="time" id="reminderTime">Loading...</div>
      <div class="task" id="reminderTask">Checking today's schedule...</div>
      <div class="instruction" id="instructionText">Please wait.</div>

      <div class="buttons" id="buttonArea">
        <button class="yes" onclick="taskDone()">✅ Yes, I did it</button>
        <button class="help" onclick="needHelp()">🆘 I need help</button>
      </div>

      <div class="status" id="statusMessage"></div>
    </div>

    <div class="pillbox">
      <div class="section-title">Today's Schedule</div>
      <div class="pill-list" id="pillList"></div>
    </div>

    <div class="upcoming">
      <div class="section-title">Next Reminder</div>
      <div class="upcoming-text" id="upcomingReminder">Loading next reminder...</div>
    </div>

    <div class="family-note">
      <div class="section-title">Family Note ❤️</div>
      <div class="family-text" id="familyNote">Loading family note...</div>
    </div>
  </div>
</div>

<audio id="reminderBell" preload="auto">
  <source src="bell.mp3" type="audio/mpeg">
</audio>

<audio id="successSound" preload="auto">
  <source src="success.mp3" type="audio/mpeg">
</audio>

<script>
  const SUPABASE_URL = "https://rsmiivsdxbnwwamdxkhm.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_QCQfaxIpjuOx_26bnBikcQ_rzF29DFa";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  const urlParams = new URLSearchParams(window.location.search);

  const TABLET_ID =
    urlParams.get("account") ||
    urlParams.get("tablet") ||
    localStorage.getItem("grandmaCareUserId") ||
    localStorage.getItem("grandmaCareUserEmail");

  const demoPhotos = [
    "family-photo-1.jpg",
    "family-photo-2.jpg",
    "family-photo-3.jpg",
    "family-photo-4.jpg"
  ];

  let photos = [...demoPhotos];
  let currentPhoto = 0;
  let appData = {};
  let allItems = [];
  let todaysItems = [];
  let currentItem = null;
  let lastReminderId = null;
  let isRefreshing = false;

  function getAutoSeasonTheme() {
    const month = new Date().getMonth() + 1;

    if (month >= 3 && month <= 5) return "spring";
    if (month >= 6 && month <= 8) return "summer";
    if (month >= 9 && month <= 11) return "fall";
    return "winter";
  }

  function applyTheme(themeChoice) {
    let theme = themeChoice || "summer";

    if (theme === "auto") {
      theme = getAutoSeasonTheme();
    }

    const allowedThemes = ["spring", "summer", "fall", "winter"];

    if (!allowedThemes.includes(theme)) {
      theme = "summer";
    }

    document.body.classList.remove(
      "theme-spring",
      "theme-summer",
      "theme-fall",
      "theme-winter"
    );

    document.body.classList.add(`theme-${theme}`);

    const themeColors = {
      spring: "#F7FFE8",
      summer: "#FFF4C7",
      fall: "#FFF0D8",
      winter: "#EAF7FF"
    };

    document
      .querySelector('meta[name="theme-color"]')
      .setAttribute("content", themeColors[theme]);
  }

  function setSyncStatus(text) {
    const el = document.getElementById("syncStatus");
    if (el) el.textContent = text;
  }

  function showNoAccountMessage() {
    setSyncStatus("No account");

    document.getElementById("helloText").textContent =
      "Tablet setup needed";

    document.getElementById("reminderTime").textContent =
      "No caregiver account connected";

    document.getElementById("reminderTask").innerHTML =
      `<div class="setup-message">
        This senior tablet is not connected to a caregiver account yet.<br><br>
        Open this page from the caregiver dashboard, or use:<br>
        senior-tablet.html?account=YOUR_ACCOUNT_ID
      </div>`;

    document.getElementById("instructionText").textContent = "";
    document.getElementById("buttonArea").style.display = "none";
    document.getElementById("pillList").innerHTML =
      `<div class="pill-row">No account connected.</div>`;
    document.getElementById("upcomingReminder").textContent =
      "Connect this tablet from the caregiver dashboard.";
    document.getElementById("familyNote").textContent =
      "No family note loaded yet.";
  }

  function todayLocalDateKey() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  function getTodayShort() {
    return new Date().toLocaleDateString("en-US", { weekday: "short" });
  }

  function getTodayFull() {
    return new Date().toLocaleDateString("en-US", { weekday: "long" });
  }

  function normalizeDay(day) {
    if (!day) return "";
    const d = String(day).toLowerCase().slice(0,3);
    const map = {
      sun:"Sun",
      mon:"Mon",
      tue:"Tue",
      wed:"Wed",
      thu:"Thu",
      fri:"Fri",
      sat:"Sat"
    };
    return map[d] || day;
  }

  function clearOldCompletionData() {
    const today = todayLocalDateKey();
    const lastDate = localStorage.getItem("grandmaLastCompletedDate");

    if (lastDate !== today) {
      localStorage.removeItem("grandmaLastCompleted");
      localStorage.removeItem("grandmaReminderCompleted");
      localStorage.removeItem("grandmaAlert");

      Object.keys(localStorage).forEach(key => {
        if (key.startsWith("completed-") && !key.startsWith(`completed-${today}-`)) {
          localStorage.removeItem(key);
        }
      });

      localStorage.setItem("grandmaLastCompletedDate", today);
    }
  }

  function rotatePhotos() {
    if (!photos || photos.length === 0) photos = [...demoPhotos];

    currentPhoto = (currentPhoto + 1) % photos.length;
    document.getElementById("familyPhoto").src = photos[currentPhoto];
  }

  function playReminderBell() {
    const bell = document.getElementById("reminderBell");

    if (bell) {
      bell.currentTime = 0;
      bell.play().catch(() => {});
    }
  }

  function playSuccessSound() {
    const sound = document.getElementById("successSound");

    if (sound) {
      sound.currentTime = 0;
      sound.play().catch(() => {});
    }
  }

  async function readDashboardData() {
    if (!TABLET_ID) {
      showNoAccountMessage();
      return null;
    }

    try {
      const { data, error } = await supabaseClient
        .from("grandma_tablets")
        .select("dashboard_data")
        .eq("tablet_id", TABLET_ID)
        .maybeSingle();

      if (error) {
        console.log("Supabase read error:", error.message);
        setSyncStatus("Cloud error");
        return readLocalBackup();
      }

      if (data && data.dashboard_data) {
        localStorage.setItem("grandmaDashboardData", JSON.stringify(data.dashboard_data));
        setSyncStatus("Cloud synced");
        return data.dashboard_data;
      }

      setSyncStatus("No cloud data");
      return readLocalBackup();

    } catch (err) {
      console.log("Cloud unavailable:", err);
      setSyncStatus("Using backup");
      return readLocalBackup();
    }
  }

  function readLocalBackup() {
    const raw = localStorage.getItem("grandmaDashboardData");

    if (raw) {
      try {
        return JSON.parse(raw);
      } catch (err) {
        return null;
      }
    }

    return null;
  }

  async function saveTabletEvent(eventType, payload) {
    if (!TABLET_ID) return;

    try {
      await supabaseClient
        .from("grandma_tablet_events")
        .insert({
          tablet_id: TABLET_ID,
          event_type: eventType,
          event_data: payload
        });
    } catch (err) {
      console.log("Tablet event not saved to cloud.", err);
    }
  }

  function getNameFromItem(item) {
    return (
      item.name ||
      item.title ||
      item.task ||
      item.label ||
      item.medication ||
      item.medicationName ||
      item.routine ||
      item.appointment ||
      item.description ||
      "Reminder"
    );
  }

  function getTimeFromItem(item) {
    return (
      item.time ||
      item.reminderTime ||
      item.startTime ||
      item.appointmentTime ||
      item.medicationTime ||
      "09:00"
    );
  }

  function getDaysFromItem(item) {
    if (Array.isArray(item.days)) return item.days.map(normalizeDay);
    if (Array.isArray(item.selectedDays)) return item.selectedDays.map(normalizeDay);
    if (item.day) return [normalizeDay(item.day)];

    if (item.frequency === "daily" || item.repeat === "daily") {
      return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    }

    return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  }

  function itemIsToday(item) {
    const todayShort = getTodayShort();
    const todayFull = getTodayFull();
    const todayDate = todayLocalDateKey();

    if (item.date) return String(item.date).includes(todayDate);
    if (item.appointmentDate) return String(item.appointmentDate).includes(todayDate);

    const days = getDaysFromItem(item);
    return days.includes(todayShort) || days.includes(todayFull);
  }

  function normalizeItem(item, type, index) {
    const id = item.id || `${type}-${index}-${getNameFromItem(item)}-${getTimeFromItem(item)}`;

    return {
      ...item,
      id: id,
      type: item.type || type,
      name: getNameFromItem(item),
      time: getTimeFromItem(item),
      days: getDaysFromItem(item)
    };
  }

  function collectAllItems(data) {
    let items = [];

    const sources = [
      { key: "medications", type: "medication" },
      { key: "meds", type: "medication" },
      { key: "routines", type: "routine" },
      { key: "dailyRoutines", type: "routine" },
      { key: "tasks", type: "routine" },
      { key: "appointments", type: "appointment" },
      { key: "customReminders", type: "reminder" },
      { key: "reminders", type: "reminder" },
      { key: "schedule", type: "reminder" }
    ];

    sources.forEach(source => {
      if (Array.isArray(data[source.key])) {
        data[source.key].forEach((item, index) => {
          items.push(normalizeItem(item, source.type, index));
        });
      }
    });

    return items.sort((a,b) => String(a.time).localeCompare(String(b.time)));
  }

  async function loadData() {
    const savedData = await readDashboardData();

    if (!TABLET_ID && !savedData) return;

    appData = {
      senior: "Senior",
      seniorName: "Senior",
      caregiver: "Family",
      caregiverName: "Family",
      familyMessage: "We love you.",
      familyNote: "We love you.",
      medications: [],
      routines: [],
      appointments: [],
      reminders: [],
      familyPhotos: [],
      theme: "summer"
    };

    if (savedData) {
      appData = {
        ...appData,
        ...savedData
      };
    }

    applyTheme(appData.theme || appData.tabletTheme || "summer");

    if (Array.isArray(appData.familyPhotos) && appData.familyPhotos.length > 0) {
      photos = appData.familyPhotos;
      document.getElementById("familyPhoto").src = photos[0];
    } else {
      photos = [...demoPhotos];
    }

    allItems = collectAllItems(appData);

    document.getElementById("helloText").textContent =
      `Hi ${appData.senior || appData.seniorName || "Senior"} ❤️`;

    const caregiverName =
      appData.caregiver || appData.caregiverName || "Family";

    const note =
      appData.familyMessage || appData.familyNote || appData.note || "";

    document.getElementById("familyNote").textContent =
      `${caregiverName} set this up for you. ${note}`;
  }

  function getCompletedKey(item) {
    const today = todayLocalDateKey();
    return `completed-${today}-${TABLET_ID}-${item.id}`;
  }

  function isCompleted(item) {
    return localStorage.getItem(getCompletedKey(item)) === "true";
  }

  function getTodaysItems() {
    return allItems
      .filter(itemIsToday)
      .sort((a, b) => String(a.time).localeCompare(String(b.time)));
  }

  function chooseCurrentItem() {
    todaysItems = getTodaysItems();

    if (todaysItems.length === 0) {
      currentItem = null;
      return;
    }

    const notCompleted = todaysItems.find(item => !isCompleted(item));

    currentItem = notCompleted || todaysItems[todaysItems.length - 1];
  }

  function getActionText(item) {
    if (!item) return "Reminder";
    if (item.type === "medication") return `Take ${item.name}.`;
    if (item.type === "appointment") return `${item.name}.`;
    return item.name;
  }

  function updateMainCard() {
    const card = document.getElementById("reminderCard");
    const buttonArea = document.getElementById("buttonArea");
    const status = document.getElementById("statusMessage");

    card.classList.remove("active-reminder", "done-reminder");

    if (!currentItem) {
      document.getElementById("reminderTime").textContent =
        "No reminders today";

      document.getElementById("reminderTask").textContent =
        "Enjoy your day ❤️";

      document.getElementById("instructionText").textContent =
        "There are no reminders scheduled for today.";

      buttonArea.style.display = "none";
      status.textContent = "";
      return;
    }

    const completed = isCompleted(currentItem);

    document.getElementById("reminderTime").textContent =
      formatTime(currentItem.time);

    document.getElementById("reminderTask").textContent =
      completed
        ? `✅ ${currentItem.name} is done.`
        : getActionText(currentItem);

    document.getElementById("instructionText").textContent =
      completed
        ? "Great job. This has been marked complete."
        : "Please press one button.";

    if (completed) {
      card.classList.add("done-reminder");
      buttonArea.style.display = "none";
      status.textContent = "";
    } else {
      card.classList.add("active-reminder");
      buttonArea.style.display = "grid";
      status.textContent = "";

      if (lastReminderId !== currentItem.id) {
        playReminderBell();
        lastReminderId = currentItem.id;
      }
    }
  }

  function renderPillList() {
    const list = document.getElementById("pillList");

    if (todaysItems.length === 0) {
      list.innerHTML =
        `<div class="pill-row">No reminders scheduled today.</div>`;
      return;
    }

    list.innerHTML = todaysItems.map(item => {
      const completed = isCompleted(item);
      const active = currentItem && item.id === currentItem.id && !completed;

      let icon = "🔔";
      if (item.type === "medication") icon = "💊";
      if (item.type === "routine") icon = "🍽️";
      if (item.type === "appointment") icon = "📅";

      return `
        <div class="pill-row ${completed ? "done" : ""} ${active ? "active" : ""}">
          <div>
            ${completed ? "✅" : icon}
            <span class="type-label">${item.type}</span>
            ${item.name}
          </div>
          <div class="pill-time">
            ${formatTime(item.time)}
          </div>
        </div>
      `;
    }).join("");
  }

  function updateUpcomingReminder() {
    if (todaysItems.length === 0) {
      document.getElementById("upcomingReminder").textContent =
        "No more reminders today.";
      return;
    }

    const nextItem = todaysItems.find(item => !isCompleted(item));

    if (nextItem) {
      document.getElementById("upcomingReminder").textContent =
        `${formatTime(nextItem.time)} — ${nextItem.name}`;
    } else {
      document.getElementById("upcomingReminder").textContent =
        "Everything is complete for today ✅";
    }
  }

  async function refreshTablet() {
    if (isRefreshing) return;
    isRefreshing = true;

    clearOldCompletionData();
    await loadData();
    chooseCurrentItem();
    updateMainCard();
    renderPillList();
    updateUpcomingReminder();

    isRefreshing = false;
  }

  async function taskDone() {
    if (!currentItem) return;

    localStorage.setItem(getCompletedKey(currentItem), "true");
    localStorage.setItem("grandmaLastCompletedDate", todayLocalDateKey());

    const senior =
      appData.senior || appData.seniorName || "Senior";

    const payload = {
      senior: senior,
      task: currentItem.name,
      type: currentItem.type,
      item_id: currentItem.id,
      time: new Date().toLocaleString(),
      status: "completed"
    };

    localStorage.setItem("grandmaLastCompleted", JSON.stringify(payload));
    localStorage.removeItem("grandmaAlert");

    await saveTabletEvent("completed", payload);
    playSuccessSound();

    document.getElementById("statusMessage").textContent =
      "🎉 Great job! This has been marked complete.";

    await refreshTablet();
  }

  async function needHelp() {
    const senior =
      appData.senior || appData.seniorName || "Senior";

    const itemName =
      currentItem ? currentItem.name : "today's reminder";

    document.getElementById("statusMessage").textContent =
      "Help requested. Your caregiver should be contacted.";

    const payload = {
      senior: senior,
      message: `${senior} requested help with ${itemName}.`,
      task: itemName,
      type: currentItem ? currentItem.type : "reminder",
      item_id: currentItem ? currentItem.id : null,
      time: new Date().toLocaleString(),
      status: "help requested"
    };

    localStorage.setItem("grandmaAlert", JSON.stringify(payload));

    await saveTabletEvent("help", payload);
    playReminderBell();
  }

  function formatTime(time) {
    if (!time) return "";

    if (String(time).includes("AM") || String(time).includes("PM")) {
      return time;
    }

    const parts = String(time).split(":");
    let hour = parseInt(parts[0]);
    const minute = parts[1] || "00";

    if (isNaN(hour)) return time;

    const ampm = hour >= 12 ? "PM" : "AM";
    hour = hour % 12 || 12;

    return `${hour}:${minute} ${ampm}`;
  }

  function updateClock() {
    const now = new Date();

    const dateString = now.toLocaleDateString("en-US", {
      weekday: "long",
      month: "long",
      day: "numeric"
    });

    const timeString = now.toLocaleTimeString("en-US", {
      hour: "numeric",
      minute: "2-digit"
    });

    document.getElementById("clockDisplay").innerHTML =
      `${dateString}<br>${timeString}`;
  }

  function removeOldServiceWorkerCache() {
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        registrations.forEach(registration => registration.unregister());
      });
    }

    if ("caches" in window) {
      caches.keys().then(names => {
        names.forEach(name => caches.delete(name));
      });
    }
  }

  function listenForRealtimeUpdates() {
    if (!TABLET_ID) return;

    supabaseClient
      .channel("grandma-tablet-live-" + TABLET_ID)
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "grandma_tablets",
          filter: `tablet_id=eq.${TABLET_ID}`
        },
        async () => {
          setSyncStatus("Updating...");
          await refreshTablet();
          setSyncStatus("Cloud synced");
        }
      )
      .subscribe((status) => {
        if (status === "SUBSCRIBED") {
          setSyncStatus("Live sync on");
        }
      });
  }

  applyTheme("summer");
  removeOldServiceWorkerCache();
  clearOldCompletionData();
  updateClock();

  if (!TABLET_ID) {
    showNoAccountMessage();
  } else {
    refreshTablet();
    listenForRealtimeUpdates();
  }

  setInterval(rotatePhotos, 5000);
  setInterval(updateClock, 1000);

  if (TABLET_ID) {
    setInterval(refreshTablet, 3000);

    setInterval(() => {
      if (currentItem && !isCompleted(currentItem)) {
        playReminderBell();
      }
    }, 60000);
  }
</script>
