<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F3F0E5">
  <link rel="icon" href="favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Senior Tablet | Grandma.care</title>

  <style>
    :root {
      --bg:#F3F0E5;
      --card:#FFFFFF;
      --text:#234A53;
      --muted:#4E707A;
      --accent:#204A53;
      --danger:#B42318;
      --success:#1F7A4D;
      --border:#D8D1C1;
      --shadow:0 10px 28px rgba(35,74,83,0.14);
      --yellow:#FFF3B0;
      --done:#DFF3E8;
    }

    * {
      box-sizing:border-box;
    }

    body {
      margin:0;
      font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      overflow:hidden;
    }

    .tablet {
      height:100vh;
      display:grid;
      grid-template-columns:38% 62%;
    }

    .photo-side {
      position:relative;
      height:100vh;
      overflow:hidden;
      background:#ddd;
    }

    .photo-side img {
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .photo-label {
      position:absolute;
      left:14px;
      bottom:14px;
      background:rgba(255,255,255,0.9);
      padding:8px 14px;
      border-radius:999px;
      font-size:.95rem;
      font-weight:900;
      color:var(--accent);
    }

    .app-side {
      height:100vh;
      padding:12px 16px;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      align-items:center;
      text-align:center;
      overflow:hidden;
    }

    .clock {
      font-size:1.28rem;
      font-weight:900;
      color:var(--accent);
      margin-bottom:4px;
      line-height:1.15;
    }

    .hello {
      font-size:1.85rem;
      font-weight:900;
      margin-bottom:8px;
      line-height:1;
    }

    .card {
      width:min(700px,100%);
      background:white;
      border-radius:22px;
      padding:14px 16px;
      box-shadow:var(--shadow);
      border:1px solid var(--border);
    }

    .active-reminder {
      background:var(--yellow);
      border:3px solid var(--accent);
    }

    .done-reminder {
      background:var(--done);
      border:3px solid var(--success);
    }

    .time {
      font-size:1.25rem;
      font-weight:900;
      color:var(--accent);
      margin-bottom:4px;
    }

    .task {
      font-size:1.75rem;
      line-height:1.05;
      font-weight:900;
      margin-bottom:6px;
    }

    .instruction {
      font-size:.95rem;
      color:var(--muted);
      margin-bottom:10px;
      font-weight:700;
    }

    .buttons {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    button {
      border:none;
      border-radius:18px;
      padding:13px 10px;
      font-size:1.05rem;
      font-weight:900;
      cursor:pointer;
      color:white;
    }

    .yes {
      background:var(--success);
    }

    .help {
      background:var(--danger);
    }

    .call {
      background:var(--accent);
      width:100%;
      margin-top:8px;
      padding:12px 10px;
      font-size:1rem;
    }

    .status {
      margin-top:8px;
      font-size:.95rem;
      font-weight:900;
    }

    .upcoming,
    .pillbox,
    .family-note {
      width:min(700px,100%);
      margin-top:8px;
      background:rgba(255,255,255,0.78);
      border:1px solid var(--border);
      border-radius:18px;
      padding:9px 12px;
      text-align:left;
    }

    .section-title {
      font-size:.72rem;
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:900;
      color:var(--muted);
      margin-bottom:4px;
    }

    .upcoming-text,
    .family-text {
      font-size:.95rem;
      font-weight:800;
      line-height:1.25;
    }

    .pill-list {
      display:grid;
      gap:6px;
      max-height:155px;
      overflow:auto;
      padding-right:3px;
    }

    .pill-row {
      background:white;
      border:1px solid var(--border);
      border-radius:12px;
      padding:8px 10px;
      font-weight:800;
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      font-size:.95rem;
    }

    .pill-row.active {
      background:var(--yellow);
      border:2px solid var(--accent);
    }

    .pill-row.done {
      background:var(--done);
      color:var(--success);
      border:2px solid var(--success);
    }

    .pill-time {
      color:var(--muted);
      font-weight:900;
      white-space:nowrap;
    }

    .type-label {
      font-size:.75rem;
      color:var(--muted);
      font-weight:900;
      text-transform:uppercase;
      margin-right:5px;
    }

    @media(max-width:850px) {
      body {
        overflow:auto;
      }

      .tablet {
        height:auto;
        min-height:100vh;
        grid-template-columns:1fr;
      }

      .photo-side {
        height:26vh;
      }

      .app-side {
        height:auto;
        min-height:74vh;
        padding:12px;
      }

      .task {
        font-size:1.55rem;
      }

      .buttons {
        grid-template-columns:1fr;
      }

      .pill-list {
        max-height:none;
      }
    }
  </style>
</head>

<body>

<div class="tablet">

  <div class="photo-side">
    <img id="familyPhoto" src="family-photo-1.jpg" alt="Family photo slideshow">
    <div class="photo-label">Family Photos ❤️</div>
  </div>

  <div class="app-side">

    <div class="clock" id="clockDisplay">Loading time...</div>
    <div class="hello" id="helloText">Hi Barbara ❤️</div>

    <div class="card active-reminder" id="reminderCard">
      <div class="time" id="reminderTime">Loading...</div>
      <div class="task" id="reminderTask">Checking today's schedule...</div>
      <div class="instruction" id="instructionText">Please wait.</div>

      <div class="buttons" id="buttonArea">
        <button class="yes" onclick="taskDone()">✅ Yes, I did it</button>
        <button class="help" onclick="needHelp()">🆘 I need help</button>
      </div>

      <div class="status" id="statusMessage"></div>
    </div>

    <div class="pillbox">
      <div class="section-title">Today's Schedule</div>
      <div class="pill-list" id="pillList"></div>
    </div>

    <div class="upcoming">
      <div class="section-title">Next Reminder</div>
      <div class="upcoming-text" id="upcomingReminder">
        Loading next reminder...
      </div>
    </div>

    <div class="family-note">
      <div class="section-title">Family Note ❤️</div>
      <div class="family-text" id="familyNote">
        Nicholas set this up for you.
      </div>
      <button class="call" onclick="callFamily()">📞 Call Family</button>
    </div>

  </div>

</div>

<audio id="reminderBell" preload="auto">
  <source src="bell.mp3" type="audio/mpeg">
</audio>

<audio id="successSound" preload="auto">
  <source src="success.mp3" type="audio/mpeg">
</audio>

<script>
  const photos = [
    "family-photo-1.jpg",
    "family-photo-2.jpg",
    "family-photo-3.jpg",
    "family-photo-4.jpg"
  ];

  let currentPhoto = 0;
  let appData = {};
  let allItems = [];
  let todaysItems = [];
  let currentItem = null;
  let lastReminderId = null;

  function todayLocalDateKey() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  function getTodayShort() {
    return new Date().toLocaleDateString("en-US", {
      weekday: "short"
    });
  }

  function getTodayFull() {
    return new Date().toLocaleDateString("en-US", {
      weekday: "long"
    });
  }

  function normalizeDay(day) {
    if (!day) return "";
    const d = String(day).toLowerCase().slice(0,3);
    const map = {
      sun:"Sun",
      mon:"Mon",
      tue:"Tue",
      wed:"Wed",
      thu:"Thu",
      fri:"Fri",
      sat:"Sat"
    };
    return map[d] || day;
  }

  function clearOldCompletionData() {
    const today = todayLocalDateKey();
    const lastDate = localStorage.getItem("grandmaLastCompletedDate");

    if (lastDate !== today) {
      localStorage.removeItem("grandmaLastCompleted");
      localStorage.removeItem("grandmaReminderCompleted");
      localStorage.removeItem("grandmaAlert");

      Object.keys(localStorage).forEach(key => {
        if (key.startsWith("completed-") && !key.startsWith(`completed-${today}-`)) {
          localStorage.removeItem(key);
        }
      });

      localStorage.setItem("grandmaLastCompletedDate", today);
    }
  }

  function rotatePhotos() {
    currentPhoto = (currentPhoto + 1) % photos.length;
    document.getElementById("familyPhoto").src = photos[currentPhoto];
  }

  function playReminderBell() {
    const bell = document.getElementById("reminderBell");

    if (bell) {
      bell.currentTime = 0;
      bell.play().catch(() => {
        console.log("Bell sound may be blocked until the tablet is tapped once.");
      });
    }
  }

  function playSuccessSound() {
    const sound = document.getElementById("successSound");

    if (sound) {
      sound.currentTime = 0;
      sound.play().catch(() => {});
    }
  }

  function readDashboardData() {
    const possibleKeys = [
      "grandmaDashboardData",
      "grandmaCareDashboardData",
      "grandmaCareData",
      "dashboardData"
    ];

    for (const key of possibleKeys) {
      const raw = localStorage.getItem(key);
      if (raw) {
        try {
          return JSON.parse(raw);
        } catch (err) {
          console.log("Could not read", key);
        }
      }
    }

    return null;
  }

  function getNameFromItem(item) {
    return (
      item.name ||
      item.title ||
      item.task ||
      item.label ||
      item.medication ||
      item.medicationName ||
      item.routine ||
      item.appointment ||
      item.description ||
      "Reminder"
    );
  }

  function getTimeFromItem(item) {
    return (
      item.time ||
      item.reminderTime ||
      item.startTime ||
      item.appointmentTime ||
      item.medicationTime ||
      "09:00"
    );
  }

  function getDaysFromItem(item) {
    if (Array.isArray(item.days)) {
      return item.days.map(normalizeDay);
    }

    if (Array.isArray(item.selectedDays)) {
      return item.selectedDays.map(normalizeDay);
    }

    if (item.day) {
      return [normalizeDay(item.day)];
    }

    if (item.frequency === "daily" || item.repeat === "daily") {
      return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    }

    return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  }

  function itemIsToday(item) {
    const todayShort = getTodayShort();
    const todayFull = getTodayFull();
    const todayDate = todayLocalDateKey();

    if (item.date) {
      return String(item.date).includes(todayDate);
    }

    if (item.appointmentDate) {
      return String(item.appointmentDate).includes(todayDate);
    }

    const days = getDaysFromItem(item);
    return days.includes(todayShort) || days.includes(todayFull);
  }

  function normalizeItem(item, type, index) {
    const id = item.id || `${type}-${index}-${getNameFromItem(item)}-${getTimeFromItem(item)}`;

    return {
      ...item,
      id: id,
      type: item.type || type,
      name: getNameFromItem(item),
      time: getTimeFromItem(item),
      days: getDaysFromItem(item)
    };
  }

  function collectAllItems(data) {
    let items = [];

    const sources = [
      { key: "reminders", type: "reminder" },
      { key: "medications", type: "medication" },
      { key: "meds", type: "medication" },
      { key: "routines", type: "routine" },
      { key: "dailyRoutines", type: "routine" },
      { key: "tasks", type: "routine" },
      { key: "appointments", type: "appointment" },
      { key: "customReminders", type: "reminder" },
      { key: "schedule", type: "reminder" }
    ];

    sources.forEach(source => {
      if (Array.isArray(data[source.key])) {
        data[source.key].forEach((item, index) => {
          items.push(normalizeItem(item, source.type, index));
        });
      }
    });

    return items.sort((a,b) => String(a.time).localeCompare(String(b.time)));
  }

  function loadData() {
    const savedData = readDashboardData();

    appData = {
      senior: "Barbara",
      caregiver: "Family",
      familyMessage: "We love you.",
      reminders: []
    };

    if (savedData) {
      appData = {
        ...appData,
        ...savedData
      };
    }

    allItems = collectAllItems(appData);

    document.getElementById("helloText").textContent =
      `Hi ${appData.senior || appData.seniorName || "Barbara"} ❤️`;

    const caregiverName = appData.caregiver || appData.caregiverName || "Family";
    const note = appData.familyMessage || appData.familyNote || appData.note || "";

    document.getElementById("familyNote").textContent =
      `${caregiverName} set this up for you. ${note}`;
  }

  function getCompletedKey(item) {
    const today = todayLocalDateKey();
    return `completed-${today}-${item.id}`;
  }

  function isCompleted(item) {
    return localStorage.getItem(getCompletedKey(item)) === "true";
  }

  function getTodaysItems() {
    return allItems
      .filter(itemIsToday)
      .sort((a, b) => String(a.time).localeCompare(String(b.time)));
  }

  function chooseCurrentItem() {
    todaysItems = getTodaysItems();

    if (todaysItems.length === 0) {
      currentItem = null;
      return;
    }

    const notCompleted = todaysItems.find(item => !isCompleted(item));

    if (notCompleted) {
      currentItem = notCompleted;
    } else {
      currentItem = todaysItems[todaysItems.length - 1];
    }
  }

  function getActionText(item) {
    if (!item) return "Reminder";

    if (item.type === "medication") {
      return `Take ${item.name}.`;
    }

    if (item.type === "appointment") {
      return `${item.name}.`;
    }

    return item.name;
  }

  function updateMainCard() {
    const card = document.getElementById("reminderCard");
    const buttonArea = document.getElementById("buttonArea");
    const status = document.getElementById("statusMessage");

    card.classList.remove("active-reminder", "done-reminder");

    if (!currentItem) {
      document.getElementById("reminderTime").textContent =
        "No reminders today";

      document.getElementById("reminderTask").textContent =
        "Enjoy your day ❤️";

      document.getElementById("instructionText").textContent =
        "There are no reminders scheduled for today.";

      buttonArea.style.display = "none";
      status.textContent = "";
      return;
    }

    const completed = isCompleted(currentItem);

    document.getElementById("reminderTime").textContent =
      formatTime(currentItem.time);

    document.getElementById("reminderTask").textContent =
      completed
        ? `✅ ${currentItem.name} is done.`
        : getActionText(currentItem);

    document.getElementById("instructionText").textContent =
      completed
        ? "Great job. This has been marked complete."
        : "Please press one button.";

    if (completed) {
      card.classList.add("done-reminder");
      buttonArea.style.display = "none";
      status.textContent = "";
    } else {
      card.classList.add("active-reminder");
      buttonArea.style.display = "grid";
      status.textContent = "";

      if (lastReminderId !== currentItem.id) {
        playReminderBell();
        lastReminderId = currentItem.id;
      }
    }
  }

  function renderPillList() {
    const list = document.getElementById("pillList");

    if (todaysItems.length === 0) {
      list.innerHTML =
        `<div class="pill-row">No reminders scheduled today.</div>`;
      return;
    }

    list.innerHTML = todaysItems.map(item => {
      const completed = isCompleted(item);
      const active = currentItem && item.id === currentItem.id && !completed;

      let icon = "🔔";
      if (item.type === "medication") icon = "💊";
      if (item.type === "routine") icon = "🍽️";
      if (item.type === "appointment") icon = "📅";

      return `
        <div class="pill-row ${completed ? "done" : ""} ${active ? "active" : ""}">
          <div>
            ${completed ? "✅" : icon}
            <span class="type-label">${item.type}</span>
            ${item.name}
          </div>
          <div class="pill-time">
            ${formatTime(item.time)}
          </div>
        </div>
      `;
    }).join("");
  }

  function updateUpcomingReminder() {
    if (todaysItems.length === 0) {
      document.getElementById("upcomingReminder").textContent =
        "No more reminders today.";
      return;
    }

    const nextItem = todaysItems.find(item => !isCompleted(item));

    if (nextItem) {
      document.getElementById("upcomingReminder").textContent =
        `${formatTime(nextItem.time)} — ${nextItem.name}`;
    } else {
      document.getElementById("upcomingReminder").textContent =
        "Everything is complete for today ✅";
    }
  }

  function refreshTablet() {
    clearOldCompletionData();
    loadData();
    chooseCurrentItem();
    updateMainCard();
    renderPillList();
    updateUpcomingReminder();
  }

  function taskDone() {
    if (!currentItem) return;

    localStorage.setItem(getCompletedKey(currentItem), "true");
    localStorage.setItem("grandmaLastCompletedDate", todayLocalDateKey());

    const senior = appData.senior || appData.seniorName || "Barbara";

    localStorage.setItem("grandmaLastCompleted", JSON.stringify({
      senior: senior,
      task: currentItem.name,
      type: currentItem.type,
      time: new Date().toLocaleString(),
      status: "completed"
    }));

    localStorage.removeItem("grandmaAlert");

    playSuccessSound();

    document.getElementById("statusMessage").textContent =
      "🎉 Great job! This has been marked complete.";

    refreshTablet();
  }

  function needHelp() {
    const senior = appData.senior || appData.seniorName || "Barbara";
    const itemName = currentItem ? currentItem.name : "today's reminder";

    document.getElementById("statusMessage").textContent =
      "Help requested. Your caregiver should be contacted.";

    localStorage.setItem("grandmaAlert", JSON.stringify({
      senior: senior,
      message: `${senior} requested help with ${itemName}.`,
      time: new Date().toLocaleString(),
      status: "help requested"
    }));

    playReminderBell();
  }

  function callFamily() {
    const caregiver = appData.caregiver || appData.caregiverName || "Family";

    document.getElementById("statusMessage").textContent =
      `Calling ${caregiver}...`;
  }

  function formatTime(time) {
    if (!time) return "";

    if (String(time).includes("AM") || String(time).includes("PM")) {
      return time;
    }

    const parts = String(time).split(":");
    let hour = parseInt(parts[0]);
    const minute = parts[1] || "00";

    if (isNaN(hour)) return time;

    const ampm = hour >= 12 ? "PM" : "AM";
    hour = hour % 12 || 12;

    return `${hour}:${minute} ${ampm}`;
  }

  function updateClock() {
    const now = new Date();

    const dateString = now.toLocaleDateString("en-US", {
      weekday: "long",
      month: "long",
      day: "numeric"
    });

    const timeString = now.toLocaleTimeString("en-US", {
      hour: "numeric",
      minute: "2-digit"
    });

    document.getElementById("clockDisplay").innerHTML =
      `${dateString}<br>${timeString}`;
  }

  function removeOldServiceWorkerCache() {
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        registrations.forEach(registration => {
          registration.unregister();
        });
      });
    }

    if ("caches" in window) {
      caches.keys().then(names => {
        names.forEach(name => caches.delete(name));
      });
    }
  }

  removeOldServiceWorkerCache();
  clearOldCompletionData();
  refreshTablet();
  updateClock();

  setInterval(rotatePhotos, 5000);
  setInterval(updateClock, 1000);
  setInterval(refreshTablet, 3000);

  setInterval(() => {
    if (currentItem && !isCompleted(currentItem)) {
      playReminderBell();
    }
  }, 60000);
</script>

</body>
</html>
